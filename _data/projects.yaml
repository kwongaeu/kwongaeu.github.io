  - title: "Verification of Sim-to-Real Transfer in RL-based End-to-End Autonomous Racing Using Visual Domain Randomization"
    subtitle: "Reinforcement Learning-Based Autonomous Racing Research"
    thumbnail: "/assets/projects/2024_sim-to-real/thumbnail.jpg"
    poster: "/assets/projects/2024_sim-to-real/poster.pdf"
    paper_pdf: ""
    code: ""
    abstract_text: >-
      This research investigates visual domain randomization for improving the sim-to-real transfer 
      of reinforcement learning policies in autonomous racing. 
      Eight autoencoder-based visual representations were trained under different lighting conditions, 
      including variations in light direction, intensity, and shadows. 
      The models were evaluated in the DonkeyCar simulator and transferred to a physical JetRacer on a figure-eight track. 
      Experimental results showed that combining light-direction and shadow randomization 
      improved real-world driving robustness compared with the baseline, 
      particularly under changing illumination conditions. 
      Additional experiments explored combining visual randomization with sensor and action randomization.
    subject: cs

